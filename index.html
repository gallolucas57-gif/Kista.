<style>
  :root{
    --rojo: #D80300;
    --rojo-oscuro: #A80200;
    --rojo-claro: #FCEBEB;
    --rosa: #F4B8B8;
    --fondo1: #FFF8F8;
    --fondo2: #FCE9E9;
    --texto-oscuro: #2B2B2E;
    --texto-medio: #6b6b70;
    --texto-claro: #a4a4a8;
    --blanco: #ffffff;
    --sombra: 0 10px 30px rgba(216,3,0,0.18);
    --radio: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--fondo2) 0%, var(--fondo1) 45%, var(--fondo2) 100%);
    color: var(--texto-oscuro);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(50px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
  }
  .blob.tl{
    width:260px;height:260px;
    background: radial-gradient(circle, var(--rosa), transparent 70%);
    top:-80px; left:-80px;
  }
  .blob.br{
    width:320px;height:320px;
    background: radial-gradient(circle, var(--rojo-claro), transparent 70%);
    bottom:-100px; right:-100px;
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding: 22px 20px 40px;
    display:flex;
    flex-direction:column;
  }

  /* ===== Header / marca ===== */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 18px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-flag{
    width:34px; height:34px;
    flex-shrink:0;
  }
  .brand-word{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size:32px;
    letter-spacing:1px;
    color: var(--rojo);
  }
  .brand-sub{
    font-size:11px;
    color: var(--texto-medio);
    letter-spacing:0.5px;
    margin-top:2px;
  }
  .logo-frame{
    width:100%;
    max-width:270px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--rojo-claro), var(--fondo1));
    box-shadow: var(--sombra);
    border-radius: 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .brand-logo{
    width:100%;
    height:auto;
    display:block;
  }

  /* ===== Contenedor de pasos ===== */
  .stage{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .step{
    display:none;
    flex-direction:column;
    animation: stepIn 0.4s ease both;
  }
  .step.active{ display:flex; }
  @keyframes stepIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .step-title{
    font-size:22px;
    font-weight:800;
    text-align:center;
    margin: 4px 0 2px;
  }
  .step-subtitle{
    font-size:13.5px;
    color: var(--texto-medio);
    text-align:center;
    margin-bottom: 22px;
  }

  /* ===== Paso 1: días ===== */
  .dias-display{
    text-align:center;
    margin: 6px 0 22px;
  }
  .dias-num{
    font-size:72px;
    font-weight:900;
    color: var(--texto-oscuro);
    line-height:1;
    display:inline-block;
    transition: transform .18s ease;
  }
  .dias-num.bump{ animation: bump .28s ease; }
  @keyframes bump{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.18); }
    70%{ transform: scale(0.95); }
    100%{ transform: scale(1); }
  }
  .dias-label{
    font-size:13px;
    color: var(--texto-medio);
    margin-top:4px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:8px;
    border-radius:99px;
    background: var(--rosa);
    outline:none;
    margin: 10px 0 20px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px;height:26px;
    border-radius:50%;
    background: var(--rojo);
    border:4px solid var(--blanco);
    box-shadow: 0 2px 8px rgba(216,3,0,0.4);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:26px;height:26px;
    border-radius:50%;
    background: var(--rojo);
    border:4px solid var(--blanco);
    box-shadow: 0 2px 8px rgba(216,3,0,0.4);
    cursor:pointer;
  }
  .quick-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-bottom:26px;
  }

  .ahorro-card{
    background: linear-gradient(135deg, var(--rojo-claro), var(--blanco));
    border: 1.5px solid var(--rosa);
    border-radius: 18px;
    padding: 18px 16px;
    text-align:center;
    margin-bottom: 26px;
  }
  .ahorro-card-title{
    font-size:13px;
    font-weight:700;
    color: var(--texto-medio);
    margin-bottom:6px;
  }
  .ahorro-card-total{
    font-size:34px;
    font-weight:900;
    color: var(--rojo);
    line-height:1.1;
    margin-bottom:8px;
  }
  .ahorro-card-sub{
    font-size:11.5px;
    color: var(--texto-claro);
    line-height:1.4;
  }
  .quick-btn{
    padding:12px 4px;
    border-radius:14px;
    border: 1.5px solid var(--rosa);
    background: var(--blanco);
    color: var(--texto-oscuro);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .quick-btn:active{ transform: scale(0.95); }
  .quick-btn.selected{
    background: var(--rojo);
    border-color: var(--rojo);
    color:#fff;
    box-shadow: var(--sombra);
  }

  /* ===== Botones generales ===== */
  .btn{
    border:none;
    border-radius:16px;
    font-weight:800;
    font-size:16px;
    padding:16px;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease, opacity .15s ease;
    width:100%;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--rojo);
    color:#fff;
    box-shadow: var(--sombra);
  }
  .btn-primary:hover{ background: var(--rojo-oscuro); }
  .btn-primary:disabled{
    background: #f2b9bd;
    box-shadow:none;
    cursor:not-allowed;
    opacity:0.8;
  }
  .btn-ghost{
    background: transparent;
    color: var(--texto-medio);
    border: 1.5px solid var(--rosa);
    font-weight:700;
  }
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:auto;
    padding-top:18px;
  }
  .btn-row .btn-ghost{ flex:0 0 34%; }
  .btn-row .btn-primary{ flex:1; }

  /* ===== Paso 2: categorías ===== */
  .cat-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-bottom: 10px;
  }
  .cat-card{
    background: var(--blanco);
    border: 2px solid var(--rosa);
    border-radius: 16px;
    padding: 12px 6px;
    text-align:center;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .cat-card:active{ transform: scale(0.96); }
  .cat-card.selected{
    border-color: var(--rojo);
    background: var(--rojo-claro);
    transform: scale(1.03);
  }
  .cat-card .icon{
    font-size:22px;
    display:block;
    margin-bottom:4px;
  }
  .cat-card .cat-name{
    font-weight:800;
    font-size:12px;
    line-height:1.2;
  }

  /* ===== Paso 3: jugar ===== */
  .play-tag{
    background: var(--blanco);
    border:1.5px solid var(--rosa);
    border-radius:99px;
    padding:8px 16px;
    font-size:12.5px;
    color: var(--texto-medio);
    text-align:center;
    align-self:center;
    margin-bottom:26px;
    font-weight:600;
  }
  .play-tag b{ color: var(--rojo); }

  .dias-restantes{
    text-align:center;
    font-size:12px;
    color: var(--texto-claro);
    margin: -14px 0 20px;
  }
  .dias-restantes b{
    color: var(--rojo);
    font-weight:800;
  }

  .regla-prenda{
    background: var(--rojo-claro);
    border: 1px solid var(--rosa);
    border-radius: 14px;
    padding: 10px 14px;
    font-size:11.5px;
    color: var(--texto-medio);
    line-height:1.4;
    text-align:center;
    margin-bottom:22px;
  }
  .regla-prenda b{ color: var(--rojo); }

  /* ===== Cartel final: abrir la alcancía ===== */
  .alcancia-overlay{
    position:fixed;
    inset:0;
    background: rgba(43,43,46,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .alcancia-overlay.show{
    display:flex;
    animation: overlayIn .25s ease both;
  }
  @keyframes overlayIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .alcancia-card{
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 30px 26px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: alcanciaPop .45s cubic-bezier(.36,1.7,.4,1) both;
  }
  @keyframes alcanciaPop{
    0%{ transform: scale(0.7); opacity:0; }
    60%{ transform: scale(1.08); opacity:1; }
    100%{ transform: scale(1); }
  }
  .alcancia-emoji{
    font-size:56px;
    margin-bottom:10px;
    display:block;
  }
  .alcancia-title{
    font-size:20px;
    font-weight:900;
    color: var(--rojo);
    margin-bottom:8px;
    line-height:1.3;
  }
  .alcancia-text{
    font-size:14px;
    color: var(--texto-medio);
    margin-bottom:22px;
    line-height:1.4;
  }

  .roulette-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex:1;
    gap:26px;
  }
  .num-display{
    font-size:96px;
    font-weight:900;
    color: var(--texto-oscuro);
    line-height:1;
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .num-display.spring{ animation: spring .5s cubic-bezier(.36,1.7,.4,1) both; }
  @keyframes spring{
    0%{ transform: scale(0.5); opacity:0; }
    60%{ transform: scale(1.15); opacity:1; }
    100%{ transform: scale(1); }
  }

  .tirar-btn{
    width:150px; height:150px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--rojo-oscuro), var(--rojo) 70%);
    color:#fff;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-weight:800;
    font-size:16px;
    letter-spacing:0.5px;
    box-shadow: 0 14px 34px rgba(216,3,0,0.38);
    cursor:pointer;
    transition: transform .15s ease;
  }
  .tirar-btn .dado{ font-size:38px; }
  .tirar-btn:hover{ transform: scale(1.05); }
  .tirar-btn:active{ transform: scale(0.94); }
  .tirar-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  /* Tarjeta 3D */
  .card-scene{
    perspective: 1200px;
    width: 260px;
    height: 320px;
    display:none;
  }
  .card-scene.show{ display:block; animation: cardAppear .35s ease both; }
  @keyframes cardAppear{
    from{ opacity:0; transform: translateY(18px) scale(0.9); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
    cursor:pointer;
  }
  .card-inner.flipped{ transform: rotateY(180deg); }
  .card-face{
    position:absolute;
    inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:26px;
    text-align:center;
  }
  .card-front{
    background: linear-gradient(150deg, var(--rojo), var(--rojo-oscuro));
    color:#fff;
    box-shadow: var(--sombra);
  }
  .card-front .prenda-word{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:10px;
  }
  .card-front .tap-hint{
    font-size:12.5px;
    opacity:0.85;
  }
  .card-back{
    background: var(--blanco);
    border:2px solid var(--rosa);
    transform: rotateY(180deg);
    box-shadow: var(--sombra);
  }
  .card-back .prenda-text{
    font-size:17px;
    font-weight:700;
    line-height:1.4;
    color: var(--texto-oscuro);
  }
  .card-back .prenda-label{
    font-size:11px;
    color: var(--rojo);
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:10px;
  }

  .play-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    margin-top: 6px;
  }
  .play-actions.hidden{ display:none; }

  @media (max-width:360px){
    .num-display{ font-size:78px; }
    .tirar-btn{ width:130px; height:130px; }
    .card-scene{ width:220px; height:280px; }
  }
</style>
</head>

  const CATEGORIAS = [
    { id:'ninos',   nombre:'Niños',   icon:'🧒', desc:'Prendas pensadas para niños' },
    { id:'escuela', nombre:'Escuela', icon:'🎒', desc:'Prendas para la escuela' },

    }catch(e){ /* si falla el guardado, seguimos sin persistencia */ }
  }

  function cargarEstado(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const datos = JSON.parse(raw);
      if(typeof datos.limiteDias === 'number') state.limiteDias = datos.limiteDias;
      if(datos.categoria && CATEGORIAS.some(c => c.id === datos.categoria)) state.categoria = datos.categoria;
      if(typeof datos.numero === 'number' || datos.numero === null) state.numero = datos.numero;
      if(typeof datos.prenda === 'string') state.prenda = datos.prenda;
      if(typeof datos.volteada === 'boolean') state.volteada = datos.volteada;
      if(Array.isArray(datos.usados)) state.usados = datos.usados;
      if(Array.isArray(datos.prendasUsadas)) state.prendasUsadas = datos.prendasUsadas;
      if(['dias','categoria','juego'].includes(datos.paso)){

  }

      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.06);
    }catch(e){}
  }

      osc.type = 'triangle';
      // Pop simple y bien audible.
      osc.frequency.setValueAtTime(500, ahora);
      osc.frequency.exponentialRampToValueAtTime(220, ahora + 0.09);
      gain.gain.setValueAtTime(0.001, ahora);
      gain.gain.exponentialRampToValueAtTime(0.35, ahora + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ahora);
      osc.stop(ahora + 0.13);
    }catch(e){}
  }

  function sonarResultado(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    try{
      const ahora = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 659.25;
      gain.gain.setValueAtTime(0.0001, ahora);
      gain.gain.exponentialRampToValueAtTime(0.16, ahora + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ahora);
      osc.stop(ahora + 0.32);
    }catch(e){}
  }

  function sonarVictoria(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    try{
      const ahora = ctx.currentTime;

      // Arpegio ascendente de fanfarria
      const notasArpegio = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
      notasArpegio.forEach((freq, i) => {
        const t = ahora + i*0.13;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.32);
      });

      // Acorde final brillante y sostenido
      const acordeStart = ahora + notasArpegio.length*0.13 + 0.05;
      const acorde = [1046.50, 1318.51, 1567.98, 2093.00];
      acorde.forEach((freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, acordeStart);
        gain.gain.exponentialRampToValueAtTime(0.12, acordeStart + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, acordeStart + 4.0);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(acordeStart); osc.stop(acordeStart + 4.1);
      });

      // Destellos finales
      const sparkleStart = acordeStart + 2.0;
      [2093.00, 2637.02].forEach((freq, i) => {
        const t = sparkleStart + i*0.2;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.55);
      });
    }catch(e){}
  }

  // Sonido de click para todos los botones y tarjetas clickeables de la app.
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, .cat-card, .quick-btn');
    if(el && !el.disabled){
      sonarClickBoton();
    }
  });

  // ---------- Utilidades ----------
  function calcularAhorro(dias){
    // Ahorro progresivo: día 1 = $1, día 2 = $2 ... día n = $n
    // Suma total = n(n+1)/2
    return dias * (dias + 1) / 2;
  }

  function formatMoney(monto){
    return '$' + Math.round(monto).toLocaleString('es-AR');
  }

  function elegirNumero(){
    // No repetir números dentro de la misma ronda de "limiteDias" días.
    if(state.usados.length >= state.limiteDias){
      state.usados = []; // se sortearon todos: se reinicia el ciclo
    }
    let candidato;
    do{
      candidato = 1 + Math.floor(Math.random() * state.limiteDias);
    }while(state.usados.includes(candidato));
    state.usados.push(candidato);
    return candidato;
  }

  function elegirPrenda(categoriaId){
    const lista = PRENDAS[categoriaId] || PRENDAS['general'];
    if(!lista || lista.length === 0) return '';
    // Prenda random por día, sin repetir hasta agotar la lista de la categoría.
    if(state.prendasUsadas.length >= lista.length){
      state.prendasUsadas = [];
    }
    let idx;
    do{
      idx = Math.floor(Math.random() * lista.length);
    }while(state.prendasUsadas.includes(idx));
    state.prendasUsadas.push(idx);
    return lista[idx];
  }

  function render(){
    if(state.paso === 'dias') renderPasoDias();
    else if(state.paso === 'categoria') renderPasoCategoria();
    else renderPasoJuego();
  }

  // ---------- PASO 1: DÍAS ----------
  function renderPasoDias(){
    stage.innerHTML = `
      <div class="step active" id="stepDias">
        <div class="step-title">¿Por cuántos días vas a jugar?</div>
        <div class="step-subtitle">Elegí un número entre 1 y 365 días</div>

        <div class="dias-display">
          <span class="dias-num" id="diasNum">${state.limiteDias}</span>
          <div class="dias-label">días</div>
        </div>

        <input type="range" id="diasSlider" min="1" max="365" value="${state.limiteDias}">

        <div class="quick-grid" id="quickGrid">
          ${QUICK_DAYS.map(d => `<button class="quick-btn${d===state.limiteDias?' selected':''}" data-dias="${d}">${d}</button>`).join('')}
        </div>

        <div class="ahorro-card">
          <div class="ahorro-card-title">💰 Ahorro estimado</div>
          <div class="ahorro-card-total" id="ahorroTotal">${formatMoney(calcularAhorro(state.limiteDias))}</div>
          <div class="ahorro-card-sub">Ahorrando $1 más cada día, ¡juntarías esto en <span id="ahorroDiasTxt">${state.limiteDias}</span> días!</div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btnContinuar" style="flex:1;">Continuar</button>
        </div>
      </div>
    `;

    const numEl = document.getElementById('diasNum');
    const slider = document.getElementById('diasSlider');
    const quickBtns = document.querySelectorAll('.quick-btn');
    const ahorroTotalEl = document.getElementById('ahorroTotal');
    const ahorroDiasTxtEl = document.getElementById('ahorroDiasTxt');

    function setDias(v, bump){
      state.limiteDias = v;
      state.usados = []; // cambiar la cantidad de días reinicia los números ya sorteados
      numEl.textContent = v;
      slider.value = v;
      quickBtns.forEach(b => b.classList.toggle('selected', Number(b.dataset.dias) === v));
      ahorroTotalEl.textContent = formatMoney(calcularAhorro(v));
      ahorroDiasTxtEl.textContent = v;
      if(bump){
        numEl.classList.remove('bump');
        void numEl.offsetWidth;
        numEl.classList.add('bump');
      }
    }

    slider.addEventListener('input', () => { setDias(Number(slider.value), false); guardarEstado(); });
    quickBtns.forEach(btn => {
      btn.addEventListener('click', () => { setDias(Number(btn.dataset.dias), true); guardarEstado(); });
    });

    document.getElementById('btnContinuar').addEventListener('click', () => {
      state.paso = 'categoria';
      guardarEstado();
      render();
    });
  }

  // ---------- PASO 2: CATEGORÍA ----------
  function renderPasoCategoria(){
    stage.innerHTML = `
      <div class="step active" id="stepCategoria">
        <div class="step-title">Elegí una categoría</div>
        <div class="step-subtitle">¿Para qué ocasión vas a jugar?</div>

        <div class="cat-grid" id="catGrid">
          ${CATEGORIAS.map((c) => `
            <div class="cat-card${state.categoria===c.id?' selected':''}" data-cat="${c.id}">
              <span class="icon">${c.icon}</span>
              <div class="cat-name">${c.nombre}</div>
            </div>
          `).join('')}
        </div>

        <div class="btn-row">
          <button class="btn btn-ghost" id="btnVolver">Volver</button>
          <button class="btn btn-primary" id="btnEmpezar" ${state.categoria ? '' : 'disabled'}>Empezar</button>
        </div>
      </div>
    `;

    document.querySelectorAll('.cat-card').forEach(card => {
      card.addEventListener('click', () => {
        if(state.categoria !== card.dataset.cat){
          state.prendasUsadas = []; // nueva categoría: reiniciar prendas ya usadas
        }
        state.categoria = card.dataset.cat;
        document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('btnEmpezar').disabled = false;
        guardarEstado();
      });
    });

    document.getElementById('btnVolver').addEventListener('click', () => {
      state.paso = 'dias';
      guardarEstado();
      render();
    });

    document.getElementById('btnEmpezar').addEventListener('click', () => {
      if(!state.categoria) return;
      state.paso = 'juego';
      state.numero = null;
      state.prenda = null;
      state.volteada = false;
      state.usados = [];
      guardarEstado();
      render();
    });
  }

  // ---------- PASO 3: JUGAR ----------
  function renderPasoJuego(){
    const cat = CATEGORIAS.find(c => c.id === state.categoria);
    const totalPrendas = (PRENDAS[state.categoria] || PRENDAS['general']).length;

    const diasRestantesInicial = Math.max(state.limiteDias - state.usados.length, 0);

    stage.innerHTML = `
      <div class="step active" id="stepJuego">
        <div class="play-tag">${cat.icon} <b>${cat.nombre}</b> · ${totalPrendas} prendas · ${state.limiteDias} días</div>
        <div class="dias-restantes" id="diasRestantes">Quedan <b>${diasRestantesInicial}</b> días por sortear</div>
        <div class="regla-prenda">💡 Cada día ahorrás la plata que toque. Si ese día <b>no ahorrás</b>, tirás el dado y cumplís la prenda que te salga.</div>

        <div class="roulette-wrap">
          <div class="num-display" id="numDisplay">${state.numero ?? '?'}</div>

          <button class="tirar-btn" id="btnTirar" ${state.tirando ? 'disabled' : ''}>
            <span class="dado">🎲</span>
            <span>Tirar</span>
          </button>

          <div class="card-scene${state.numero ? ' show' : ''}" id="cardScene">
            <div class="card-inner${state.volteada ? ' flipped' : ''}" id="cardInner">
              <div class="card-face card-front">
                <div class="prenda-word">PRENDA</div>
                <div class="tap-hint">Tocá para dar vuelta</div>
              </div>
              <div class="card-face card-back">
                <div class="prenda-label">TU PRENDA</div>
                <div class="prenda-text" id="prendaText">${state.prenda || ''}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="play-actions${state.numero ? '' : ' hidden'}" id="playActions">
          <button class="btn btn-primary" id="btnTirarDeNuevo">Tirar de nuevo</button>
          <button class="btn btn-ghost" id="btnCambiarOpciones">Cambiar opciones</button>
        </div>
      </div>

      <div class="alcancia-overlay" id="alcanciaOverlay">
        <div class="alcancia-card">
          <span class="alcancia-emoji">🐷🎉</span>
          <div class="alcancia-title">¡Llegó la hora de<br>abrir la alcancía!</div>
          <div class="alcancia-text">Completaste los ${state.limiteDias} días. ¡Es momento de contar los ahorros!</div>
          <button class="btn btn-primary" id="btnCerrarAlcancia">¡Genial!</button>
        </div>
      </div>
    `;

    const numDisplay = document.getElementById('numDisplay');
    const btnTirar = document.getElementById('btnTirar');
    const cardScene = document.getElementById('cardScene');
    const cardInner = document.getElementById('cardInner');
    const prendaText = document.getElementById('prendaText');
    const playActions = document.getElementById('playActions');
    const diasRestantesEl = document.getElementById('diasRestantes');
    const alcanciaOverlay = document.getElementById('alcanciaOverlay');

    document.getElementById('btnCerrarAlcancia').addEventListener('click', () => {
      alcanciaOverlay.classList.remove('show');
    });

    function tirarDado(){
      if(state.tirando) return;
      getAudioCtx(); // desbloquea el audio en el gesto del usuario (click)
      state.tirando = true;
      state.volteada = false;
      cardInner.classList.remove('flipped');
      cardScene.classList.remove('show');
      btnTirar.disabled = true;

      // Secuencia de tiempos entre "vueltas": empieza rápido y se va frenando,
      // como una ruleta real, para que se escuchen bien los últimos ticks.
      const demoras = [60,60,65,70,75,85,95,105,120,135,150,170,190,210,235,260,290,320];
      let paso = 0;

      function siguienteVuelta(){
        sonarTick();
        const randomTemp = 1 + Math.floor(Math.random() * state.limiteDias);
        numDisplay.textContent = randomTemp;
        paso++;

        if(paso < demoras.length){
          setTimeout(siguienteVuelta, demoras[paso]);
          return;
        }

        const numeroFinal = elegirNumero();
        state.numero = numeroFinal;
        state.prenda = elegirPrenda(state.categoria);

        numDisplay.textContent = numeroFinal;
        numDisplay.classList.remove('spring');
        void numDisplay.offsetWidth;
        numDisplay.classList.add('spring');

        prendaText.textContent = state.prenda;
        cardScene.classList.add('show');
        playActions.classList.remove('hidden');

        const diasRestantes = Math.max(state.limiteDias - state.usados.length, 0);
        const cicloCompleto = diasRestantes === 0;
        diasRestantesEl.innerHTML = cicloCompleto
          ? '¡Sorteaste los ' + state.limiteDias + ' días! 🎊'
          : 'Quedan <b>' + diasRestantes + '</b> días por sortear';

        sonarResultado();
        if(cicloCompleto){
          setTimeout(() => {
            alcanciaOverlay.classList.add('show');
            sonarVictoria();
          }, 500);
        }

        state.tirando = false;
        btnTirar.disabled = false;
        guardarEstado();
      }

      setTimeout(siguienteVuelta, demoras[0]);
    }

    btnTirar.addEventListener('click', tirarDado);

    cardInner.addEventListener('click', () => {
      if(!state.numero) return;
      state.volteada = !state.volteada;
      cardInner.classList.toggle('flipped', state.volteada);
      guardarEstado();
    });

    document.getElementById('btnTirarDeNuevo').addEventListener('click', tirarDado);

    document.getElementById('btnCambiarOpciones').addEventListener('click', () => {
      state.paso = 'dias';
      state.numero = null;
      state.prenda = null;
      state.volteada = false;
      state.usados = [];
      state.prendasUsadas = [];
      guardarEstado();
      render();
    });
  }

  // ---------- Iniciar ----------
  cargarEstado();
  render();
})();

</script>
</body>
</html>
